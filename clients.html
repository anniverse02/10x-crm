<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Clients | 10X CRM</title>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/clients.css">
</head>

<body>

  <header class="main-header">

    <a href="dashboard.html" class="logo">
      <span class="logo-mark">10X</span>
      <span>10X CRM</span>
    </a>

    <nav class="main-navigation">
      <a href="dashboard.html">Dashboard</a>
      <a href="clients.html" class="active">Clients</a>
      <a href="profile.html">Profile</a>
    </nav>

    <div class="header-actions">

      <button
        type="button"
        id="themeToggle"
        class="theme-button"
      >
        🌙
      </button>

      <button
        type="button"
        id="logoutButton"
        class="logout-button"
      >
        Logout
      </button>

    </div>

  </header>

  <main class="clients-container">

    <section class="clients-heading">

      <div>
        <h1>Clients</h1>
        <p>Manage your clients and their deals.</p>
      </div>

      <button
        type="button"
        id="openClientModal"
        class="add-client-button"
      >
        + Add Client
      </button>

    </section>

    <section class="clients-toolbar">

      <div class="search-wrapper">

        <label for="searchInput">
          Search clients
        </label>

        <input
          type="text"
          id="searchInput"
          placeholder="Search by name or company"
        >

      </div>

      <div class="filter-wrapper">

        <p>Filter by status</p>

        <div class="filter-buttons">

          <button
            type="button"
            class="filter-button active"
            data-status="All"
          >
            All
          </button>

          <button
            type="button"
            class="filter-button"
            data-status="Lead"
          >
            Lead
          </button>

          <button
            type="button"
            class="filter-button"
            data-status="Contacted"
          >
            Contacted
          </button>

          <button
            type="button"
            class="filter-button"
            data-status="Won"
          >
            Won
          </button>

          <button
            type="button"
            class="filter-button"
            data-status="Lost"
          >
            Lost
          </button>

        </div>

      </div>

      <div class="sort-wrapper">

        <label for="sortSelect">
          Sort clients
        </label>

        <select id="sortSelect">
          <option value="newest">
            Newest
          </option>

          <option value="oldest">
            Oldest
          </option>

          <option value="value-high">
            Deal Value: High to Low
          </option>

          <option value="value-low">
            Deal Value: Low to High
          </option>
        </select>

      </div>

    </section>

    <section class="clients-list-section">

      <div
        id="clientsList"
        class="clients-list"
      >
        <p class="loading-message">
          Loading clients...
        </p>
      </div>

    </section>

  </main>

  <!-- Add Client Modal -->

  <div id="clientModal" class="modal">

    <div class="modal-content">

      <div class="modal-header">

        <div>
          <h2>Add Client</h2>
          <p>
            Enter the new client's information.
          </p>
        </div>

        <button
          type="button"
          id="closeClientModal"
          class="close-modal-button"
          aria-label="Close modal"
        >
          &times;
        </button>

      </div>

      <form id="addClientForm" novalidate>

        <div class="form-group">

          <label for="clientName">
            Name
          </label>

          <input
            type="text"
            id="clientName"
            placeholder="Enter client name"
          >

          <p
            id="clientNameError"
            class="field-error"
          ></p>

        </div>

        <div class="form-group">

          <label for="clientEmail">
            Email
          </label>

          <input
            type="text"
            id="clientEmail"
            placeholder="client@example.com"
          >

          <p
            id="clientEmailError"
            class="field-error"
          ></p>

        </div>

        <div class="form-group">

          <label for="clientPhone">
            Phone
          </label>

          <input
            type="text"
            id="clientPhone"
            placeholder="Phone number (optional)"
          >

          <p
            id="clientPhoneError"
            class="field-error"
          ></p>

        </div>

        <div class="form-group">

          <label for="clientCompany">
            Company
          </label>

          <input
            type="text"
            id="clientCompany"
            placeholder="Company (optional)"
          >

        </div>

        <div class="form-group">

          <label for="clientDealValue">
            Deal Value
          </label>

          <input
            type="number"
            id="clientDealValue"
            placeholder="Enter deal value"
          >

          <p
            id="clientDealValueError"
            class="field-error"
          ></p>

        </div>

        <div class="form-group">

          <label for="clientStatus">
            Status
          </label>

          <select id="clientStatus">
            <option value="Lead" selected>
              Lead
            </option>

            <option value="Contacted">
              Contacted
            </option>

            <option value="Won">
              Won
            </option>

            <option value="Lost">
              Lost
            </option>
          </select>

        </div>

        <div class="modal-actions">

          <button
            type="button"
            id="cancelClientButton"
            class="cancel-button"
          >
            Cancel
          </button>

          <button
            type="submit"
            class="save-client-button"
          >
            Add Client
          </button>

        </div>

      </form>

    </div>

  </div>

  <!-- Client Details Modal -->

  <div id="clientDetailsModal" class="modal">

    <div class="modal-content details-modal-content">

      <div class="modal-header">

        <h2>Client Details</h2>

        <button
          type="button"
          id="closeDetailsModal"
          class="close-modal-button"
          aria-label="Close details modal"
        >
          &times;
        </button>

      </div>

      <div id="clientDetailsContent"></div>

    </div>

  </div>

  <div
    id="toast"
    class="toast"
    role="status"
  ></div>

  <script src="js/guard.js"></script>

  <script>
    checkAuth();
  </script>

  <script
    type="module"
    src="js/clients.js"
  ></script>

  <script src="js/theme.js"></script>

</body>
</html>
```
