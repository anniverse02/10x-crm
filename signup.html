<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>10X CRM Sign Up</title>

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <main class="auth-page">
  <section class="auth-card">

    <div class="brand">
      <div class="brand-logo">10X</div>
      <span>10X CRM</span>
    </div>

    <div class="auth-heading">
      <h1>Create your account</h1>
      <p>Start managing your clients in one place.</p>
    </div>

    <form id="signupForm" novalidate>
      <div class="form-group">
        <label for="fullName">Full Name</label>
        <input
          type="text"
          id="fullName"
          name="fullName"
          placeholder="Enter your full name"
        />
        <p class="field-error" id="fullNameError"></p>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="text"
          id="email"
          name="email"
          placeholder="you@example.com"
        />
        <p class="field-error" id="emailError"></p>
      </div>

      <div class="form-group">
        <label for="company">Company</label>
        <input
          type="text"
          id="company"
          name="company"
          placeholder="Company (optional)"
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Create a password"
        />
        <p class="field-error" id="passwordError"></p>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input
          type="password"
          id="confirmPassword"
          name="confirmPassword"
          placeholder="Repeat your password"
        />
        <p class="field-error" id="confirmPasswordError"></p>
      </div>

      <button type="submit" class="primary-button">
        Create Account
      </button>
    </form>

    <p class="auth-link-text">
      Already have an account?
      <a href="index.html">Log in</a>
    </p>
  </section>
  
  <script src="js/guard.js"></script>
  <script>
    redirectIfLoggedIn();
   </script>
  <script src="js/signup.js"></script>
<div id="toast" class="toast" role="status"></div>
<script type="module" src="js/signup.js"></script>
</main>
